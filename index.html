
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="/products" id="form">
        <h2>Login</h2>
        <label for="user">Username
            <input type="text" name="username" id="user" placeholder="Enter username">
        </label><br><br>
        <label for="pass">Password
            <input type="password" name="Password" id="pass" placeholder="Enter Password">
        </label><br><br>
        <button type="submit">Submit</button>
    </form>

    <div class="products" id="products-section">
        <div class="card">
            <h4>Mobile Phone</h4>
            <img src="./mobile.png" alt="phone">
            <p>iPhone 16 Pro<br>89,000</p>
        </div>
        <div class="card">
            <h4>Laptop</h4>
            <img src="./mobile.png" alt="laptop">
            <p>MacBook M1<br>1,19,000</p>
        </div>
        <div class="card">
            <h4>Headset</h4>
            <img src="./mobile.png" alt="headset">
            <p>Sony Headphones<br>21,000</p>
        </div>
        <div class="card">
            <h4>Mouse</h4>
            <img src="./mobile.png" alt="mouse">
            <p>Zebronics<br>1,200</p>
        </div>
    </div>

    <div class="banner" id="banner-section">
        <h2>Biggest Sale</h2>
        <p>Grab the opportunities now</p>
    </div>

    <script src="script.js"></script>
</body>
